services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: textile_sentiment
      JWT_SECRET: change-this-in-production
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    volumes:
      - textile_mongo:/data/db
volumes:
  textile_mongo:
